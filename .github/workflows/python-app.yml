name: PPOIS CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./lab1

    steps:
    - name: 1. Скачивание кода репозитория
      uses: actions/checkout@v4

    - name: 2. Настройка окружения Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: 3. Установка необходимых библиотек
      run: |
        python -m pip install --upgrade pip
        pip install flake8 coverage pyinstaller

    - name: 4. Проверка качества кода (Linter)
      run: |
        flake8 . --count --max-line-length=150 --show-source --statistics

    - name: 5. Запуск unit-тестов и проверка покрытия
      run: |
          # Тесты для словаря
          coverage run -a -m unittest dictionary/test_dictionary.py
          # Тесты для множества
          coverage run -a -m unittest set/test_set.py
          coverage report -m

    - name: 6. Сборка независимых исполняемых файлов
      run: |
           # Собираем словарь
           pyinstaller --onefile dictionary/main.py --name dictionary-app-linux
           # Собираем множество
            pyinstaller --onefile set/main.py --name set-app-linux

    - name: 7. Сохранение артефакта сборки
      uses: actions/upload-artifact@v4
      with:
        name: dictionary-app-linux
        path: lab1/dist/main